[versions]
agp = "9.3.2"             # Android Gradle Plugin stable (resolu 2026-08-29). AGP 9.x integre Kotlin
                          # nativement (plus besoin du plugin kotlin-android, voir app/build.gradle.kts).
kotlin = "2.4.10"         # dernier stable, entraine le plugin Compose Compiler (memes numero)
composeBom = "2026.08.00" # androidx.compose:compose-bom, derniere BOM stable
# Librairies non couvertes par le compose-bom : versions stables resolues individuellement.
activityCompose = "1.13.0"
# androidx.core:core porte NotificationCompat / ServiceCompat / ContextCompat, dont
# OngoingMatch depend directement. 1.18.0 est deja la version resolue par le graphe
# transitif : on la DECLARE pour ne pas compiler contre une dependance de dependance,
# qu'une montee de version de Compose pourrait retirer sans prevenir.
core = "1.18.0"
wearComposeMaterial = "1.6.2"
wearComposeFoundation = "1.6.2"
wearOngoing = "1.1.0"
okhttp = "5.5.0"
kotlinxSerializationJson = "1.11.0"
junit = "4.13.2"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-core = { module = "androidx.core:core", version.ref = "core" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
wear-compose-material = { module = "androidx.wear.compose:compose-material", version.ref = "wearComposeMaterial" }
wear-compose-foundation = { module = "androidx.wear.compose:compose-foundation", version.ref = "wearComposeFoundation" }
wear-ongoing = { module = "androidx.wear:wear-ongoing", version.ref = "wearOngoing" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
